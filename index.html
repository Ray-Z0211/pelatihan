<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Pengaturan karakter dan tampilan layar HP/Responsive -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PERBAIKAN: Mengubah <tittle> menjadi <title> -->
    <title>profil saya - Rayyan</title>
    
    <!-- Menghubungkan file HTML dengan file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container utama kartu profil -->
    <div class="kartu-profil">
        <!-- Gambar profil -->
        <img src="foto-profil.jpg" alt="Foto profil saya">
        
        <!-- Judul nama -->
        <h1>Nama Lengkap Anda</h1>
        
        <!-- PERBAIKAN: Mengubah penutup </h1> menjadi </p> agar cocok dengan tag pembuka <p> -->
        <p>Siswa SMK yang selalu semangat belajar dan mempelajari hal baru.</p>
        
        <!-- Tombol interaktif -->
        <button id="button">Helo guys!</button>
    </div>

    <!-- PERBAIKAN: Mengubah penulisan tag </srcipt> yang salah ketik menjadi </script> -->
    <script src="script.js"></script>
</body>
</html>
